<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio</title>
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  html { scroll-behavior:smooth; scroll-snap-type:y proximity; }
  body { font-family:'Segoe UI', Arial, sans-serif; color:#2c2115; background:#fdf6f0; }
  a { color:inherit; text-decoration:none; }
  h1, h2, h3 { font-family:Georgia, 'Times New Roman', serif; }

  section, footer.contact, .hero { scroll-snap-align:start; scroll-snap-stop:normal; }

  /* Reveal-on-scroll (fade + slide up) */
  .reveal { opacity:0; transform:translateY(42px); transition:opacity .9s cubic-bezier(.16,.8,.24,1), transform .9s cubic-bezier(.16,.8,.24,1); will-change:opacity, transform; }
  .reveal.visible { opacity:1; transform:translateY(0); }

  /* Header */
  header { background:#c1613f; padding:18px 48px; display:flex; justify-content:space-between; align-items:center; }
  header .logo { color:#fff; font-weight:700; letter-spacing:2px; font-size:16px; }
  header .logo .tag { display:block; font-size:9px; letter-spacing:2px; font-weight:400; opacity:.85; margin-top:2px; }
  header nav a { color:#fff; font-size:13px; margin-left:28px; opacity:.95; }
  header nav a:hover { opacity:1; text-decoration:underline; }

  /* Hero */
  .hero { display:grid; grid-template-columns:1fr 1fr; align-items:stretch; background:#fdf1e7; }
  .hero-text { padding:70px 48px; }
  .hero-text .eyebrow { color:#c1613f; font-size:12px; font-weight:700; letter-spacing:2px; margin-bottom:14px; }
  .hero-text h1 { font-size:38px; line-height:1.25; color:#2c2115; margin-bottom:18px; }
  .hero-text h1 .highlight { color:#c1613f; }
  .hero-text .rule { width:50px; height:3px; background:#c1613f; margin-bottom:18px; }
  .hero-text p { font-size:14.5px; color:#5a4f42; line-height:1.7; max-width:420px; margin-bottom:26px; }
  .hero-text .cta { display:inline-block; background:#c1613f; color:#fff; font-size:12px; font-weight:700; letter-spacing:1px; padding:14px 26px; border-radius:4px; }
  .hero-text .cta:hover { background:#a84f31; }

  .hero-image { position:relative; background:linear-gradient(135deg,#e0b193,#c98a63); overflow:hidden; }
  .hero-image img { width:100%; height:100%; object-fit:cover; display:block; }
  .hero-image .placeholder { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; flex-direction:column; color:#fff; font-size:12px; letter-spacing:1px; text-align:center; gap:10px; }

  /* About */
  .about { display:flex; gap:40px; align-items:center; padding:60px 48px; max-width:1100px; margin:0 auto; }
  .about .icon-circle { width:150px; height:150px; border-radius:50%; background:#f4c6a8; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:40px; }
  .about h2 { font-size:26px; margin-bottom:14px; }
  .about p { font-size:14px; color:#5a4f42; line-height:1.8; max-width:640px; }

  /* Section shared */
  section.block { padding:60px 48px; }
  section.block.tinted { background:#f7ded1; }
  .section-title { text-align:center; margin-bottom:36px; }
  .section-title h2 { font-size:28px; margin-bottom:10px; }
  .section-title .rule { width:50px; height:3px; background:#c1613f; margin:0 auto; }

  /* Projects grid */
  .grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:22px; max-width:1000px; margin:0 auto; }
  .proj-card { display:flex; gap:16px; background:#fdf6f0; border-radius:8px; overflow:hidden; padding:12px; }
  .proj-card .thumb { width:110px; height:110px; flex-shrink:0; border-radius:6px; overflow:hidden; background:#e8d8ca; display:flex; align-items:center; justify-content:center; color:#a5917d; font-size:11px; }
  .proj-card .thumb img { width:100%; height:100%; object-fit:cover; }
  .proj-card h3 { font-size:15px; margin-bottom:6px; }
  .proj-card p { font-size:12.5px; color:#6b5f50; line-height:1.6; }
  .proj-card a.link { font-size:11.5px; color:#c1613f; display:inline-block; margin-top:6px; }

  /* Skills pills */
  .skills-wrap { display:flex; flex-wrap:wrap; gap:10px; justify-content:center; max-width:900px; margin:0 auto; }
  .skill-pill { background:#fff; border:1px solid #e8d8ca; color:#5a4f42; border-radius:20px; padding:8px 18px; font-size:12.5px; }

  /* List-style cards (publications, experience, education) */
  .list-cards { display:flex; flex-direction:column; gap:14px; max-width:820px; margin:0 auto; }
  .list-card { background:#fdf6f0; border-radius:8px; padding:20px 24px; }
  .list-card .row { display:flex; justify-content:space-between; align-items:baseline; flex-wrap:wrap; gap:6px; }
  .list-card h3 { font-size:15.5px; }
  .list-card .meta { font-size:11.5px; color:#a5917d; }
  .list-card .sub { font-size:12.5px; color:#8a7a67; margin:2px 0 8px; }
  .list-card p { font-size:12.5px; color:#6b5f50; line-height:1.7; }
  .list-card a.link { font-size:11.5px; color:#c1613f; display:inline-block; margin-top:6px; }

  /* Contact footer */
  footer.contact { background:#c1613f; color:#fff; padding:60px 48px; position:relative; overflow:hidden; }
  .contact-inner { display:grid; grid-template-columns:1fr 1fr; gap:40px; max-width:1000px; margin:0 auto; position:relative; z-index:1; }
  .contact-inner h2 { font-size:26px; margin-bottom:14px; }
  .contact-inner .rule { width:50px; height:3px; background:#fff; margin-bottom:20px; opacity:.8; }
  .contact-inner p { font-size:13.5px; opacity:.9; line-height:1.7; margin-bottom:18px; max-width:360px; }
  .contact-email { display:flex; align-items:center; gap:10px; font-size:14px; }
  .contact-email .icon { width:36px; height:36px; border-radius:50%; background:rgba(255,255,255,0.2); display:flex; align-items:center; justify-content:center; font-size:14px; }
  .connect h3 { font-size:16px; margin-bottom:16px; }
  .social-row { display:flex; gap:12px; }
  .social-row a { width:40px; height:40px; border-radius:50%; background:rgba(255,255,255,0.2); display:flex; align-items:center; justify-content:center; font-size:15px; }
  .social-row a:hover { background:rgba(255,255,255,0.35); }

  @media (max-width: 800px) {
    .hero { grid-template-columns:1fr; }
    .grid-2 { grid-template-columns:1fr; }
    .contact-inner { grid-template-columns:1fr; }
    .about { flex-direction:column; text-align:center; }
  }
</style>
</head>
<body>

<header>
  <div class="logo" id="logoName">LOADING
    <span class="tag" id="logoTag"></span>
  </div>
  <nav>
    <a href="#about">About Me</a>
    <a href="#projects">Projects</a>
    <a href="#contact">Contact Me</a>
  </nav>
</header>

<section class="hero">
  <div class="hero-text">
    <div class="eyebrow" id="eyebrow"></div>
    <h1 id="headline"></h1>
    <div class="rule"></div>
    <p id="heroBio"></p>
    <a class="cta" id="ctaBtn" href="#contact"></a>
  </div>
  <div class="hero-image" id="heroImageWrap">
    <div class="placeholder">
      <span>&#128247;</span>
      <span>HERO IMAGE</span>
    </div>
  </div>
</section>

<section class="about" id="about">
  <div class="icon-circle">&#127793;</div>
  <div>
    <h2>About Me</h2>
    <p id="aboutBio"></p>
  </div>
</section>

<section class="block tinted" id="skillsSection">
  <div class="section-title"><h2>Skills</h2><div class="rule"></div></div>
  <div class="skills-wrap" id="skills"></div>
</section>

<section class="block" id="projectsSection">
  <div class="section-title"><h2>Projects</h2><div class="rule"></div></div>
  <div class="grid-2" id="projects"></div>
</section>

<section class="block tinted" id="publicationsSection">
  <div class="section-title"><h2>Publications</h2><div class="rule"></div></div>
  <div class="list-cards" id="publications"></div>
</section>

<section class="block" id="experienceSection">
  <div class="section-title"><h2>Experience</h2><div class="rule"></div></div>
  <div class="list-cards" id="experience"></div>
</section>

<section class="block tinted" id="educationSection">
  <div class="section-title"><h2>Education</h2><div class="rule"></div></div>
  <div class="list-cards" id="education"></div>
</section>

<footer class="contact" id="contact">
  <div class="contact-inner">
    <div>
      <h2>Let's Work Together</h2>
      <div class="rule"></div>
      <p>Have a project in mind or want to learn more about how I can help? I'd love to hear from you.</p>
      <div class="contact-email">
        <span class="icon">&#9993;</span>
        <a id="email" href="#"></a>
      </div>
    </div>
    <div class="connect">
      <h3>Connect with me</h3>
      <div class="social-row" id="socialRow"></div>
    </div>
  </div>
</footer>

<script>
const revealObserver = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      entry.target.classList.add('visible');
      revealObserver.unobserve(entry.target);
    }
  });
}, { threshold: 0.15, rootMargin: '0px 0px -40px 0px' });

function reveal(el, delayMs = 0) {
  el.classList.add('reveal');
  if (delayMs) el.style.transitionDelay = delayMs + 'ms';
  revealObserver.observe(el);
}

// static elements already in the DOM before content loads
reveal(document.querySelector('.hero-text'));
reveal(document.querySelector('.hero-image'), 150);
reveal(document.querySelector('.about .icon-circle'));
reveal(document.querySelector('.about > div:last-child'), 120);
document.querySelectorAll('.section-title').forEach(el => reveal(el));
reveal(document.querySelector('.contact-inner > div:first-child'));
reveal(document.querySelector('.contact-inner > div.connect'), 150);

async function load() {
  const res = await fetch('content.json?t=' + Date.now());
  const data = await res.json();

  document.getElementById('logoName').firstChild.textContent = (data.name || '').toUpperCase() + ' ';
  document.getElementById('logoTag').textContent = (data.title || '').toUpperCase();

  document.getElementById('eyebrow').textContent = (data.title || '').toUpperCase();

  const headlineEl = document.getElementById('headline');
  const headline = data.headline || data.title || '';
  const hi = data.headlineHighlight || '';
  headlineEl.innerHTML = hi && headline.includes(hi)
    ? headline.replace(hi, `<span class="highlight">${hi}</span>`)
    : headline;

  document.getElementById('heroBio').textContent = data.bio || '';
  document.getElementById('aboutBio').textContent = data.bio || '';
  document.getElementById('ctaBtn').textContent = data.ctaText || "LET'S CONNECT";
  document.getElementById('email').textContent = data.email || '';
  document.getElementById('email').href = 'mailto:' + (data.email || '');

  if (data.profileImage) {
    document.getElementById('heroImageWrap').innerHTML = `<img src="${data.profileImage}" alt="${data.name}">`;
  }

  const skillsEl = document.getElementById('skills');
  skillsEl.innerHTML = '';
  (data.skills || []).forEach((s, i) => {
    const pill = document.createElement('span');
    pill.className = 'skill-pill';
    pill.textContent = s.name;
    skillsEl.appendChild(pill);
    reveal(pill, (i % 6) * 60);
  });
  document.getElementById('skillsSection').style.display = (data.skills || []).length ? '' : 'none';

  const projEl = document.getElementById('projects');
  projEl.innerHTML = '';
  (data.projects || []).forEach((p, i) => {
    const card = document.createElement('div');
    card.className = 'proj-card';
    const thumb = p.image ? `<img src="${p.image}">` : (i + 1);
    card.innerHTML = `
      <div class="thumb">${thumb}</div>
      <div>
        <h3>${p.title}</h3>
        <p>${p.description || ''}</p>
        ${p.link ? `<a class="link" href="${p.link}" target="_blank">View project ↗</a>` : ''}
      </div>
    `;
    projEl.appendChild(card);
    reveal(card, (i % 2) * 100);
  });
  document.getElementById('projectsSection').style.display = (data.projects || []).length ? '' : 'none';

  const pubEl = document.getElementById('publications');
  pubEl.innerHTML = '';
  (data.publications || []).forEach((pub, i) => {
    const card = document.createElement('div');
    card.className = 'list-card';
    card.innerHTML = `
      <div class="row"><h3>${pub.title}</h3><span class="meta">${pub.date || ''}</span></div>
      <div class="sub">${pub.publisher || ''}</div>
      ${pub.description ? `<p>${pub.description}</p>` : ''}
      ${pub.link ? `<a class="link" href="${pub.link}" target="_blank">View publication ↗</a>` : ''}
    `;
    pubEl.appendChild(card);
    reveal(card, (i % 4) * 70);
  });
  document.getElementById('publicationsSection').style.display = (data.publications || []).length ? '' : 'none';

  const expEl = document.getElementById('experience');
  expEl.innerHTML = '';
  (data.experience || []).forEach((x, i) => {
    const card = document.createElement('div');
    card.className = 'list-card';
    card.innerHTML = `
      <div class="row"><h3>${x.role}</h3><span class="meta">${x.dates || ''}</span></div>
      <div class="sub">${x.company || ''}${x.type ? ' · ' + x.type : ''}${x.location ? ' · ' + x.location : ''}</div>
      <p>${x.description || ''}</p>
    `;
    expEl.appendChild(card);
    reveal(card, (i % 4) * 70);
  });
  document.getElementById('experienceSection').style.display = (data.experience || []).length ? '' : 'none';

  const eduEl = document.getElementById('education');
  eduEl.innerHTML = '';
  (data.education || []).forEach((e, i) => {
    const card = document.createElement('div');
    card.className = 'list-card';
    card.innerHTML = `
      <div class="row"><h3>${e.school}</h3><span class="meta">${e.years || ''}</span></div>
      <div class="sub">${e.degree || ''}</div>
    `;
    eduEl.appendChild(card);
    reveal(card, (i % 4) * 70);
  });
  document.getElementById('educationSection').style.display = (data.education || []).length ? '' : 'none';

  const socials = data.socials || {};
  const socialRow = document.getElementById('socialRow');
  socialRow.innerHTML = '';
  const socialIcons = { linkedin: 'in', instagram: '&#128247;', twitter: '&#120143;' };
  Object.keys(socialIcons).forEach(key => {
    if (socials[key]) {
      const a = document.createElement('a');
      a.href = socials[key];
      a.target = '_blank';
      a.innerHTML = socialIcons[key];
      socialRow.appendChild(a);
    }
  });
  if (data.email) {
    const a = document.createElement('a');
    a.href = 'mailto:' + data.email;
    a.innerHTML = '&#9993;';
    socialRow.appendChild(a);
  }
}
load();
</script>

</body>
</html>
